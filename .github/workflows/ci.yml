name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')/ $(xcodebuild -showsdks | grep -o 'iphoneos[0-9.]*' | sort -V | tail -1)"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Coverfy.xcodeproj \
            -scheme Coverfy \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Surface build failure
        if: failure()
        run: |
          grep -iE "error:" xcodebuild.log | tail -n 30 | while IFS= read -r line; do
            echo "::error::$line"
          done
